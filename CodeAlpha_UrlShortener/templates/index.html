<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f2f5;
        color: #333;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        padding: 40px;
        width: 100%;
        max-width: 500px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
        color: #1a1a2e;
      }
      .subtitle {
        color: #666;
        margin-bottom: 24px;
        font-size: 14px;
      }
      .input-group {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      input[type="text"] {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }
      input[type="text"]:focus {
        border-color: #4361ee;
      }
      button {
        padding: 12px 24px;
        background: #4361ee;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
      }
      button:hover {
        background: #3a56d4;
      }
      button:disabled {
        background: #a0a0a0;
        cursor: not-allowed;
      }
      .result {
        margin-top: 16px;
        padding: 16px;
        background: #f8f9fa;
        border-radius: 8px;
        display: none;
      }
      .result.show {
        display: block;
      }
      .result .short {
        font-size: 18px;
        color: #4361ee;
        word-break: break-all;
        margin-bottom: 4px;
      }
      .result .full {
        font-size: 13px;
        color: #666;
        word-break: break-all;
      }
      .stats {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #e0e0e0;
      }
      .stats h3 {
        font-size: 14px;
        color: #666;
        margin-bottom: 8px;
      }
      .stats-table {
        width: 100%;
        font-size: 13px;
      }
      .stats-table th {
        text-align: left;
        color: #999;
        padding: 4px 0;
        font-weight: normal;
      }
      .stats-table td {
        padding: 4px 0;
        word-break: break-all;
      }
      .stats-table td a {
        color: #4361ee;
        text-decoration: none;
      }
      .stats-table td a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔗 URL Shortener</h1>
      <p class="subtitle">Paste a long URL and get a short link</p>
      <div class="input-group">
        <input
          type="text"
          id="urlInput"
          placeholder="https://example.com/very/long/path..."
        />
        <button onclick="shorten()" id="shortenBtn">Shorten</button>
      </div>
      <div class="result" id="result">
        <div class="short" id="shortUrl"></div>
        <div class="full" id="fullUrl"></div>
      </div>
      <div class="stats" id="stats" style="display: none">
        <h3>Recent URLs</h3>
        <div class="stats-table" id="statsTable"></div>
      </div>
    </div>
    <script>
      function shorten() {
        const url = document.getElementById("urlInput").value.trim();
        if (!url) return;
        const btn = document.getElementById("shortenBtn");
        btn.disabled = true;
        btn.textContent = "Shortening...";
        fetch("/api/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ long_url: url }),
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.error) {
              alert(data.error);
              btn.disabled = false;
              btn.textContent = "Shorten";
              return;
            }
            document.getElementById("shortUrl").innerHTML =
              `<a href="${data.short_url}" target="_blank" style="color:#4361ee;text-decoration:none;">${data.short_url}</a>`;
            document.getElementById("fullUrl").textContent =
              "Redirects to: " + data.long_url;
            document.getElementById("result").classList.add("show");
            btn.disabled = false;
            btn.textContent = "Shorten";
            loadStats();
          })
          .catch(() => {
            alert("Error");
            btn.disabled = false;
            btn.textContent = "Shorten";
          });
      }
      document.getElementById("urlInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") shorten();
      });
      function loadStats() {
        fetch("/api/stats")
          .then((r) => r.json())
          .then((data) => {
            if (data.total_urls === 0) {
              document.getElementById("stats").style.display = "none";
              return;
            }
            document.getElementById("stats").style.display = "block";
            let html = "<table><tr><th>Short</th><th>Long URL</th></tr>";
            data.recent.forEach((r) => {
              html += `<tr><td><a href="${r.short_code}" target="_blank">${r.short_code}</a></td><td>${r.long_url}</td></tr>`;
            });
            html += "</table>";
            document.getElementById("statsTable").innerHTML = html;
          });
      }
      loadStats();
    </script>
  </body>
</html>
